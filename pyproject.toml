[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-biometrics"
version = "0.1.0"
description = "Face detection and face recognition models"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]